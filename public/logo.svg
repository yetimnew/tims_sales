<svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .logo-text { 
        font-family: 'Instrument Sans', 'Segoe UI', Arial, sans-serif; 
      }
      .logo-main-text {
        fill: rgb(15, 23, 42);
      }
      .logo-sub-text {
        fill: rgb(71, 85, 105);
      }
      @media (prefers-color-scheme: dark) {
        .logo-main-text {
          fill: rgb(248, 250, 252);
        }
        .logo-sub-text {
          fill: rgb(203, 213, 225);
        }
      }
    </style>
  </defs>
  <image href="/favicon.ico" x="0" y="0" width="80" height="80" preserveAspectRatio="xMidYMid meet"/>
  <text x="100" y="46" class="logo-text logo-main-text" font-weight="600" font-size="36">TIMS</text>
  <text x="100" y="64" class="logo-text logo-sub-text" font-weight="500" font-size="16">Transport Integrated Management System</text>
</svg>
