name: driver_mobile_app
description: Driver mobile application for TIMS (Transport Information Management System)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Local Storage (Offline Support)
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  location: ^5.0.3

  # Background Tasks
  workmanager: ^0.5.2
  flutter_background_service: ^5.0.5

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Maps
  google_maps_flutter: ^2.5.0
  flutter_map: ^6.1.0

  # Notifications
  flutter_local_notifications: ^16.3.0
  firebase_messaging: ^14.7.9
  firebase_core: ^2.24.2

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.1
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  url_launcher: ^6.2.2

  # JSON Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # assets:
  #   - images/
  #   - icons/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf

